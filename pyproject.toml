[project]
name = "cybereval"
version = "1.0.0"
description = "Enterprise Cybersecurity AI Reasoning Benchmark & Evaluation Platform"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "SriRam Kunamsetty", email = "mohansriramkunamsetty@gmail.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
    "networkx>=3.2.1",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.9",
    "click>=8.1.7",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
cybereval = "cybereval.cli.main:cli"

[tool.setuptools]
packages = ["cybereval", "cybereval.core", "cybereval.models", "cybereval.schemas", "cybereval.services", "cybereval.api", "cybereval.api.v1", "cybereval.cli"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
