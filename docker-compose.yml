version: "3.8"

services:
  cybereval-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybereval-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CYBEREVAL_SECRET_KEY=${CYBEREVAL_SECRET_KEY:-ephemeral-secure-token}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///app/cybereval.db}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - cybereval-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  cybereval-data:
